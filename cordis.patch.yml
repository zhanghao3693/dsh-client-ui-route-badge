# dsh-client-ui-route-badge profile patch layer
#
# 这个文件是「命令安装能否生效」的关键：`dsh plugin add` 只有在包的 package.json
# 声明了 `dsh.bundle.patch` 时，才会把本插件并入 profile 的 layer 栈；
# 否则它只被当成一个普通依赖装进去，**进程不会加载它**，用户会看到「装成功但没反应」。
# （2026-09-25 由本站 L5 运行时冒烟发现：0.1.0 缺此声明，实测装后 client 模块从未注册。）
#
# id 必须与 host 入口里的插件名一致（lib/index.js 中 `export const name = "route-badge"`）。
# name 是 npm 包名，dsh 由它同时解析出 host 入口（main）与 client 入口（exports["./client"]）。
- insert:
    - id: route-badge
      name: 'dsh-client-ui-route-badge'
